name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Скачивание вашего кода
        uses: actions/checkout@v4

      - name: 2. Установка Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Установка Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Упаковка index.html в Android-проект (Capacitor)
        run: |
          mkdir -p www
          cp index.html www/index.html
          
          cat << 'EOF' > package.json
          {
            "name": "print3d-studio",
            "version": "1.0.0",
            "private": true
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.print3d.studio",
            "appName": "3D Print Studio",
            "webDir": "www"
          }
          EOF

          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android

      - name: 5. Компиляция установочного APK файла
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 6. Выгрузка готового APK файла для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Print-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
