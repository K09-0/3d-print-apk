name: Build Android APK v3.0

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Скачивание вашего кода
        uses: actions/checkout@v4

      - name: 2. Установка Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Установка Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Установка 3D-движка и НАТИВНЫХ плагинов сохранения файлов Android
        run: |
          mkdir -p www
          cp index.html www/index.html

          cat << 'EOF' > package.json
          {
            "name": "print3d-cad-pro",
            "version": "3.0.0",
            "private": true
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.print3d.studio",
            "appName": "Print CAD Pro",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          # Устанавливаем ядро Capacitor + Нативные плагины Filesystem и Share для реального сохранения на телефон
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 three@0.160.0 three-mesh-bvh@0.7.3 three-bvh-csg@0.0.16

          # Копируем 3D-библиотеки внутрь APK для мгновенной работы
          mkdir -p www/libs/addons
          cp node_modules/three/build/three.module.js www/libs/three.module.js
          cp -r node_modules/three/examples/jsm/* www/libs/addons/
          cp node_modules/three-mesh-bvh/build/index.module.js www/libs/three-mesh-bvh.js
          cp node_modules/three-bvh-csg/build/index.module.js www/libs/three-bvh-csg.js

          npx cap add android
          npx cap sync android

      - name: 5. Добавление разрешений памяти в AndroidManifest.xml и установка Иконки
        run: |
          # Прописываем разрешения на запись и чтение файлов в манифест Android
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <application android:requestLegacyExternalStorage="true"/' "$MANIFEST"

          # Генерация иконки приложения
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          cat << 'EOF' > icon.svg
          <svg width="512" height="512" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="64" height="64" rx="14" fill="#1E2229"/>
            <rect x="2" y="2" width="60" height="60" rx="12" stroke="#3A414D" stroke-width="2"/>
            <path d="M32 35L48 43V55L32 61L16 55V43L32 35Z" fill="#2F3640" stroke="#ECEFF1" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M32 35V47M32 47L48 43M32 47L16 43" stroke="#ECEFF1" stroke-width="2.2"/>
            <path d="M21 6H43V17L36 27H28L21 17V6Z" fill="#FF6D00" stroke="#14171A" stroke-width="2" stroke-linejoin="round"/>
            <rect x="24" y="10" width="16" height="4" fill="#14171A"/>
            <line x1="32" y1="27" x2="32" y2="37" stroke="#00E676" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
          EOF

          for dir in android/app/src/main/res/mipmap-*; do
            if [ -f "$dir/ic_launcher.png" ]; then
              rsvg-convert -w 192 -h 192 icon.svg -o "$dir/ic_launcher.png"
              rsvg-convert -w 192 -h 192 icon.svg -o "$dir/ic_launcher_round.png"
              rsvg-convert -w 192 -h 192 icon.svg -o "$dir/ic_launcher_foreground.png"
            fi
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: 6. Компиляция установочного APK файла
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 7. Выгрузка готового APK файла
        uses: actions/upload-artifact@v4
        with:
          name: Print-CAD-Pro-v3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk