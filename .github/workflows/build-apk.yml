name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Скачивание вашего кода
        uses: actions/checkout@v4

      - name: 2. Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Установка Java 17 (для сборщика Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Установка Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Упаковка index.html в Android-проект (Capacitor)
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "3D Print Studio" "com.print3d.studio" --web-dir www
          npx cap add android

      - name: 6. Компиляция установочного APK файла
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 7. Выгрузка готового APK файла для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Print-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
